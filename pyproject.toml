[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stylefork"
version = "0.2.1"
description = "Local image review and agent-assisted creation with immutable, forkable styles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "kamahir0"}]

[project.urls]
Repository = "https://github.com/kamahir0/stylefork"
Issues = "https://github.com/kamahir0/stylefork/issues"

[project.scripts]
stylefork = "stylekit.__main__:main"

[tool.setuptools.packages.find]
include = ["stylekit*"]

[tool.setuptools.package-data]
stylekit = ["web/*.html", "web/*.js", "web/*.css", "resources/image-workflow/SKILL.md", "resources/image-workflow/agents/openai.yaml"]
